[project]
name = "phc-nzi"
version = "0.1.0"
description = "Modular MPB configuration, HPC runner, frequency extractor, grid rectifier, and plotter package for photonic crystal calculations"
readme = "README.md"
authors = [
    { name = "Enrico Vallar", email = "s232699@dtu.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "h5py>=3.0.0",
]

[project.scripts]
phc-runner = "phc_nzi.runner:main"
phc-extractor = "phc_nzi.extractor:main"
phc-plotter = "phc_nzi.plotter:main"
phc-rectifier = "phc_nzi.rectifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
