# ==============================================================================
# 2D Photonic Crystal Master Bayesian Optimization Configuration (Hydra)
# ==============================================================================

defaults:
  - simulation: default
  - parameters: pillars_2d
  - target: accidental_dirac_2d
  - optimizer: bayesian
  - postprocessing: default
  - _self_

general:
  name: "InP_2D_Pillars_Accidental_Dirac"
  output_dir: "bo_output"
  log_level: "INFO"
  clean_output: false
  postprocess_only: false

hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
